name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run web:test
      # G4 parity for the WebUI tree (acceptance.md §1 keeps src/; this adds web/src)
      - run: "grep -rEn \"console\\.log\" web/src && exit 1 || exit 0"