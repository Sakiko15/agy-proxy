# Container image release: manual dispatch only (charter red line — images are
# pushed solely on the user's explicit release command, never automatically).
# Pushes to GHCR (ghcr.io), authorized by the workflow's own GITHUB_TOKEN —
# no registry secrets to configure. The build is self-contained (the Dockerfile
# compiles the gateway bundle in a build stage; no prebuilt dist/ needed).
# The first push creates the package PRIVATE — flip it to Public once in
# GitHub → Your packages → agy-proxy → Package settings for anonymous pulls.
name: docker-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (must match package.json version)"
        required: true
        default: "0.2.0"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/sakiko15/agy-proxy:${{ inputs.version }}
            ghcr.io/sakiko15/agy-proxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max