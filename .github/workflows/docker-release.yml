# Docker image release: manual dispatch only (charter red line — images are
# pushed solely on the user's explicit release command, never automatically).
# The build is self-contained (Dockerfile compiles the gateway bundle in a
# build stage) — no prebuilt dist/ is committed or required.
# Secrets needed: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Docker Hub access token).
name: docker-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (must match package.json version)"
        required: true
        default: "0.2.0"

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/sakiko15/agy-proxy:${{ inputs.version }}
            docker.io/sakiko15/agy-proxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max