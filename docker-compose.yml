# agy-proxy compose — image defaults to the published Docker Hub tag (override
# via AGY_PROXY_IMAGE in .env); runbook: docs/deploy.md
services:
  gateway:
    image: ${AGY_PROXY_IMAGE:-ghcr.io/sakiko15/agy-proxy:0.2.0}
    container_name: agy-proxy
    restart: unless-stopped
    init: false # tini is the in-container PID 1 (Docker's --init must not wrap it)
    stop_grace_period: 30s # in-flight agy children get the full teardown window
    ports:
      - "127.0.0.1:8080:8080" # loopback only; front with a TLS reverse proxy (docs/deploy.md)
    volumes:
      - agy-data:/data
    environment:
      AGY_PROXY_HOST: "0.0.0.0"
      AGY_PROXY_PORT: "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  agy-data: