# agy-proxy compose — image defaults to the published ghcr.io :latest and is
# re-pulled on every `up` (override via AGY_PROXY_IMAGE in .env, e.g. a local
# build when ghcr is unreachable — docs/deploy.md path A); runbook: docs/deploy.md
services:
  gateway:
    image: ${AGY_PROXY_IMAGE:-ghcr.io/sakiko15/agy-proxy:latest}
    pull_policy: always # restart: unless-stopped never re-pulls; every `up -d` fetches :latest fresh
    container_name: agy-proxy
    restart: unless-stopped
    init: false # tini is the in-container PID 1 (Docker's --init must not wrap it)
    stop_grace_period: 40s # must exceed the in-process grace (shutdownGraceMs, default 25s) + teardown margin
    logging: # S9: bound log growth on the volume (per-request NDJSON is chatty)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8080:8080" # loopback only; front with a TLS reverse proxy (docs/deploy.md)
    volumes:
      - agy-data:/data
    environment:
      AGY_PROXY_HOST: "0.0.0.0"
      AGY_PROXY_PORT: "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  agy-data: